services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: FarmManagementDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d FarmManagementDb"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./FarmManagement.Api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=FarmManagementDb;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./farm-management-web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata: